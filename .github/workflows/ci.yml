name: CI
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      app: "${{ steps.paths.outputs.app }}"
      api: "${{ steps.paths.outputs.api }}"
      tdlib: "${{ steps.paths.outputs.tdlib }}"
      integration: "${{ steps.paths.outputs.integration }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - id: paths
        env:
          BASE_SHA: "${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}"
          HEAD_SHA: "${{ github.sha }}"
          EVENT_NAME: "${{ github.event_name }}"
        run: |
          if [[ "$EVENT_NAME" == push || "$EVENT_NAME" == merge_group || -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            python3 .github/scripts/detect_changes.py ALL "$HEAD_SHA"
          else
            python3 .github/scripts/detect_changes.py "$BASE_SHA" "$HEAD_SHA"
          fi

  workflow-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - id: toolchain
        uses: ./.github/actions/toolchain-versions # zizmor: ignore[self-repository]
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with: {version: "${{ steps.toolchain.outputs.uv-version }}", enable-cache: true}
      - run: make workflow-audit

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    uses: ./.github/workflows/app-build.yml # zizmor: ignore[self-repository]
    with: {artifact-name: "app-ci-${{ github.run_id }}"}

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    env:
      APP_ENV: testing
      APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - id: toolchain
        uses: ./.github/actions/toolchain-versions # zizmor: ignore[self-repository]
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "${{ steps.toolchain.outputs.php-version }}"
          extensions: pdo_pgsql, pcntl
          tools: "composer:${{ steps.toolchain.outputs.composer-version }}"
          coverage: none
      - name: Check Pint, PHPStan, Pest and PostgreSQL migrations
        run: make api-check

  tdlib:
    needs: changes
    if: needs.changes.outputs.tdlib == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - id: toolchain
        uses: ./.github/actions/toolchain-versions # zizmor: ignore[self-repository]
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "${{ steps.toolchain.outputs.python-version }}"}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: "tdlib-native-${{ matrix.compiler }}-${{ hashFiles('backend-tdlib/CMakeLists.txt', 'backend-tdlib/cmake/**', 'backend-tdlib/include/**', 'backend-tdlib/src/**', 'backend-tdlib/tests/**', 'toolchain.env') }}"
          restore-keys: "tdlib-native-${{ matrix.compiler }}-"
      - name: Install build prerequisites
        env:
          CMAKE_VERSION: "${{ steps.toolchain.outputs.cmake-version }}"
          CLANG_FORMAT_VERSION: "${{ steps.toolchain.outputs.clang-format-version }}"
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache gperf libssl-dev ninja-build php-cli zlib1g-dev clang
          python -m pip install "cmake==$CMAKE_VERSION" "clang-format==$CLANG_FORMAT_VERSION"
      - name: Build and test the native adapter
        env:
          CC: "${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }}"
          CXX: "${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}"
          CCACHE_COMPRESS: "1"
          CCACHE_MAXSIZE: 1500M
        run: |
          mapfile -t sources < <(find backend-tdlib/include backend-tdlib/src backend-tdlib/tests -type f \( -name '*.cpp' -o -name '*.hpp' \) -print)
          clang-format --dry-run --Werror "${sources[@]}"
          ccache --zero-stats
          cmake -S backend-tdlib -B backend-tdlib/build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DTELEBEZEL_BUILD_TESTS=ON
          cmake --build backend-tdlib/build --target telebezel-tdlib telebezel-tdlib-tests telebezel-tdlib-runtime-tests telebezel-tdlib-failure-tests --parallel 2
          ctest --test-dir backend-tdlib/build --output-on-failure
          ccache --show-stats

  tdlib-analysis:
    needs: changes
    if: needs.changes.outputs.tdlib == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: "tdlib-analysis-gcc-${{ hashFiles('backend-tdlib/CMakeLists.txt', 'backend-tdlib/cmake/**', 'backend-tdlib/include/**', 'backend-tdlib/src/**', 'backend-tdlib/tests/**', 'toolchain.env') }}"
          restore-keys: "tdlib-analysis-gcc-"
      - run: |
          sudo apt-get update
          sudo apt-get install -y ccache clang clang-tidy cppcheck cmake gperf libssl-dev ninja-build php-cli zlib1g-dev
      - name: Analyze only adapter source files
        run: |
          ccache --zero-stats
          cmake -S backend-tdlib -B backend-tdlib/analysis-build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DTELEBEZEL_BUILD_TESTS=ON
          cmake --build backend-tdlib/analysis-build --target tdapi --parallel 2
          python3 backend-tdlib/tests/analyse.py backend-tdlib/analysis-build
      - name: Run GoogleTest with ASan/UBSan, TSan and standalone LSan
        run: |
          bash backend-tdlib/tests/sanitizers.sh backend-tdlib/analysis-build cmake
          ccache --show-stats

  api-image:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    permissions: {contents: read}
    uses: ./.github/workflows/container-image-check.yml # zizmor: ignore[self-repository]
    with:
      component: backend-api
      image-name: telebezel-backend-api-ci
      tag: "ci-${{ github.run_id }}"

  tdlib-image:
    needs: changes
    if: needs.changes.outputs.tdlib == 'true'
    permissions: {contents: read}
    uses: ./.github/workflows/container-image-check.yml # zizmor: ignore[self-repository]
    with:
      component: backend-tdlib
      image-name: telebezel-backend-tdlib-ci
      tag: "ci-${{ github.run_id }}"

  integration:
    needs: [changes, api, tdlib, api-image, tdlib-image]
    if: ${{ always() && needs.changes.outputs.integration == 'true' && (needs.api.result == 'success' || needs.api.result == 'skipped') && (needs.tdlib.result == 'success' || needs.tdlib.result == 'skipped') && (needs.api-image.result == 'success' || needs.api-image.result == 'skipped') && (needs.tdlib-image.result == 'success' || needs.tdlib-image.result == 'skipped') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: ./.github/actions/integration-images # zizmor: ignore[self-repository]
      - run: sudo apt-get update && sudo apt-get install -y acl
      - id: functional-toolchain
        uses: ./.github/actions/toolchain-versions # zizmor: ignore[self-repository]
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "${{ steps.functional-toolchain.outputs.node-version }}"
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "${{ steps.functional-toolchain.outputs.php-version }}"
          extensions: pdo_pgsql, pcntl
          tools: "composer:${{ steps.functional-toolchain.outputs.composer-version }}"
          coverage: none
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: "functional-tdlib-${{ hashFiles('backend-tdlib/**', 'toolchain.env') }}"
          restore-keys: "functional-tdlib-"
      - name: Install functional test prerequisites
        env:
          CMAKE_VERSION: "${{ steps.functional-toolchain.outputs.cmake-version }}"
        run: |
          sudo apt-get update
          sudo apt-get install -y ccache gperf libssl-dev ninja-build zlib1g-dev
          python3 -m pip install "cmake==$CMAKE_VERSION"
          npm ci --prefix tests/browser
          tests/browser/node_modules/.bin/agent-browser install --with-deps
      - name: Test API against C++ HTTP runtime with scripted Telegram success and failures
        env:
          APP_ENV: testing
          APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          CCACHE_COMPRESS: "1"
          CCACHE_MAXSIZE: 1500M
        run: PATH="$PWD/tests/browser/node_modules/.bin:$PATH" make functional-test CMAKE_BIN=cmake TDLIB_CMAKE_ARGS=-DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - run: make integration-test
        env:
          GHCR_OWNER: "${{ github.repository_owner }}"
          TELEBEZEL_INTEGRATION_PREBUILT: "1"

  ci-gate:
    if: always()
    needs: [changes, workflow-audit, app, api, tdlib, tdlib-analysis, api-image, tdlib-image, integration]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Require every applicable check
        env:
          CHANGES: "${{ needs.changes.result }}"
          AUDIT: "${{ needs.workflow-audit.result }}"
          APP: "${{ needs.app.result }}"
          API: "${{ needs.api.result }}"
          TDLIB: "${{ needs.tdlib.result }}"
          TDLIB_ANALYSIS: "${{ needs.tdlib-analysis.result }}"
          API_IMAGE: "${{ needs.api-image.result }}"
          TDLIB_IMAGE: "${{ needs.tdlib-image.result }}"
          INTEGRATION: "${{ needs.integration.result }}"
          EXPECT_APP: "${{ needs.changes.outputs.app }}"
          EXPECT_API: "${{ needs.changes.outputs.api }}"
          EXPECT_TDLIB: "${{ needs.changes.outputs.tdlib }}"
          EXPECT_INTEGRATION: "${{ needs.changes.outputs.integration }}"
        run: python3 .github/scripts/ci_gate.py

name: Read TeleBezel toolchain versions
description: Parse the repository's strict toolchain.env file
outputs:
  php-version: {value: "${{ steps.read.outputs.php-version }}"}
  composer-version: {value: "${{ steps.read.outputs.composer-version }}"}
  node-version: {value: "${{ steps.read.outputs.node-version }}"}
  python-version: {value: "${{ steps.read.outputs.python-version }}"}
  uv-version: {value: "${{ steps.read.outputs.uv-version }}"}
  pebble-tool-version: {value: "${{ steps.read.outputs.pebble-tool-version }}"}
  pebble-sdk-version: {value: "${{ steps.read.outputs.pebble-sdk-version }}"}
  cmake-version: {value: "${{ steps.read.outputs.cmake-version }}"}
  clang-format-version: {value: "${{ steps.read.outputs.clang-format-version }}"}
runs:
  using: composite
  steps:
    - id: read
      shell: bash
      run: |
        set -euo pipefail
        declare -A requested=(
          [PHP_VERSION]=php-version [COMPOSER_VERSION]=composer-version
          [NODE_VERSION]=node-version [PYTHON_VERSION]=python-version
          [UV_VERSION]=uv-version [PEBBLE_TOOL_VERSION]=pebble-tool-version
          [PEBBLE_SDK_VERSION]=pebble-sdk-version [CMAKE_VERSION]=cmake-version
          [CLANG_FORMAT_VERSION]=clang-format-version
        )
        while IFS='=' read -r key value; do
          if [[ -n "${requested[$key]:-}" ]]; then printf '%s=%s\n' "${requested[$key]}" "$value" >> "$GITHUB_OUTPUT"; unset 'requested[$key]'; fi
        done < toolchain.env
        if (( ${#requested[@]} )); then printf 'missing toolchain keys: %s\n' "${!requested[*]}" >&2; exit 1; fi

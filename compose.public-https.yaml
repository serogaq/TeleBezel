services:
  backend-api:
    environment:
      APP_URL: "https://${TELEBEZEL_DOMAIN:?set TELEBEZEL_DOMAIN}"
      TRUSTED_PROXIES: "${TELEBEZEL_CADDY_ADDRESS:-10.254.238.254}"
  caddy:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      TELEBEZEL_DOMAIN: "${TELEBEZEL_DOMAIN:?set TELEBEZEL_DOMAIN}"
      ACME_EMAIL: "${ACME_EMAIL:?set ACME_EMAIL}"
    volumes:
      - ./deploy/Caddyfile.public:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs:
      - /tmp:size=32m,mode=1777
    networks:
      api-ingress:
        ipv4_address: "${TELEBEZEL_CADDY_ADDRESS:-10.254.238.254}"
      https-egress: {}
    depends_on:
      backend-api: {condition: service_healthy}
networks:
  api-ingress:
    internal: true
    ipam:
      config: [{subnet: "${TELEBEZEL_INGRESS_SUBNET:-10.254.238.0/24}"}]
  https-egress: {}
volumes:
  caddy-data: {}
  caddy-config: {}
